name: Build, Deploy

# on: [ push, pull_request ]-
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      - name: Prepare Signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASESTOREPASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASEKEYPASSWORD }}
          RELEASE_KEYSTORE: ${{ vars.RELEASE_KEYSTORE }}
          RELEASE_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_PASSWORD" ] && [ -n "$RELEASE_KEYSTORE" ] && [ -n "$RELEASE_KEY_ALIAS" ]; then
            printf "%s" "$KEYSTORE_B64" | base64 -d > "$RELEASE_KEYSTORE"
            {
              echo "keystore.file=$RELEASE_KEYSTORE"
              echo "keystore.password=$RELEASE_STORE_PASSWORD"
              echo "keystore.key.alias=$RELEASE_KEY_ALIAS"
              echo "keystore.key.password=$RELEASE_KEY_PASSWORD"
            } >> keystore.properties
          else
            echo "Signing secrets/vars not fully set. Skip signing setup."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/4.0-dev' }}

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --info --warning-mode all --console=plain 2>&1 | tee gradle-build.log

      - name: Upload Gradle Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Parse Output Metadata
        id: apk_meta
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          path = "./app/build/outputs/apk/release/output-metadata.json"
          if not os.path.exists(path):
              print("output-metadata.json missing", file=sys.stderr)
              sys.exit(1)

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          elements = data.get("elements") or []
          if not elements:
              print("output-metadata.json elements empty", file=sys.stderr)
              sys.exit(1)

          elem = elements[0]
          version_code = elem.get("versionCode", "")
          version_name = elem.get("versionName", "")

          out_path = os.environ.get("GITHUB_OUTPUT")
          if not out_path:
              print("GITHUB_OUTPUT not set", file=sys.stderr)
              sys.exit(1)

          with open(out_path, "a", encoding="utf-8") as out:
              out.write(f"version_code={version_code}\n")
              out.write(f"version_name={version_name}\n")
          PY

      - name: Upload Release Package
        uses: actions/upload-artifact@v4
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        with:
          name: "release-${{ steps.apk_meta.outputs.version_name }}(${{ steps.apk_meta.outputs.version_code }})"
          path: ./app/build/outputs/apk/release

      - name: Compute Release Meta
        id: release_meta
        env:
          version_code: ${{ steps.apk_meta.outputs.version_code }}
          version_name: ${{ steps.apk_meta.outputs.version_name }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            name="release-${version_name}(${version_code})"
            prerelease="false"
          else
            tag="ci-${GITHUB_RUN_ID}"
            name="ci-${version_name}(${version_code})"
            prerelease="true"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
          files: ./app/build/outputs/apk/release/*.apk

