name: Build and Publish Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - 4.0-dev
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle and restore cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/4.0-dev' }}

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD" >&2; exit 1; }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > tieba-release.jks
          cat > keystore.properties <<EOF
          keystore.file=tieba-release.jks
          keystore.password=$ANDROID_KEYSTORE_PASSWORD
          keystore.key.alias=$ANDROID_KEY_ALIAS
          keystore.key.password=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 tieba-release.jks keystore.properties

          keytool -list \
            -keystore tieba-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

      - name: Build release APK
        shell: bash
        run: ./gradlew assembleRelease --stacktrace --warning-mode all --console=plain

      - name: Verify arm64-v8a output and collect metadata
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          metadata="app/build/outputs/apk/release/output-metadata.json"
          test -f "$metadata" || { echo "Missing $metadata" >&2; exit 1; }

          python3 - "$metadata" "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          metadata_path = pathlib.Path(sys.argv[1])
          output_path = pathlib.Path(sys.argv[2])
          data = json.loads(metadata_path.read_text(encoding="utf-8"))
          elements = data.get("elements") or []
          arm64 = [
              item for item in elements
              if any(filt.get("value") == "arm64-v8a" for filt in item.get("filters", []))
          ]
          if len(arm64) != 1:
              raise SystemExit(f"Expected exactly one arm64-v8a APK, found {len(arm64)}")

          element = arm64[0]
          apk_path = pathlib.Path("app/build/outputs/apk/release") / element["outputFile"]
          if not apk_path.is_file():
              raise SystemExit(f"Missing APK: {apk_path}")

          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"apk_path={apk_path.as_posix()}\n")
              output.write(f"version_code={element['versionCode']}\n")
              output.write(f"version_name={element['versionName']}\n")
          print(f"Verified {apk_path} ({apk_path.stat().st_size} bytes)")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tieba-lite-${{ steps.apk.outputs.version_name }}-${{ steps.apk.outputs.version_code }}-arm64-v8a
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Compute Release metadata
        id: release
        env:
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            name="TiebaLite ${VERSION_NAME} (${VERSION_CODE})"
            if [[ "$tag" == *-* ]]; then
              prerelease=true
            else
              prerelease=false
            fi
          else
            tag="ci-${VERSION_CODE}-${GITHUB_RUN_NUMBER}"
            name="TiebaLite ${VERSION_NAME} (${VERSION_CODE}) CI #${GITHUB_RUN_NUMBER}"
            prerelease=true
          fi

          {
            echo "tag=$tag"
            echo "name=$name"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.apk.outputs.apk_path }}
